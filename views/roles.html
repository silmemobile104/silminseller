<div id="view-roles">
    <!-- [1] หัวหน้า — DESIGN.md ข้อ 11.2 -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <i class="bi bi-shield-check text-ink w-5 text-2xl text-center"></i>
            <h3 class="text-2xl text-ink">ระดับสิทธิ์การใช้งาน</h3>
        </div>
        <button id="btn-add-role" type="button"
            class="px-4 py-2 bg-primary hover:bg-[#E2B93C] text-on-primary font-medium rounded-xl transition-all flex items-center gap-2 w-fit cursor-pointer">
            <i class="fa-solid fa-plus"></i>
            <p>เพิ่มบทบาทใหม่</p>
        </button>
    </div>

    <!-- [2] การ์ดพาเนล — แถบควบคุม + ชิป + กริดบทบาท อยู่ในการ์ดใบเดียว (ข้อ 11.1, 11.3) -->
    <div class="bg-panel/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">
        <!-- 2a แถบควบคุม (ข้อ 11.4) -->
        <div class="p-6 pb-0 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h3 class="text-lg text-ink flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-accent-ink"></i> บทบาททั้งหมด
                <span id="roles-count-badge"
                    class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-chip/60 text-ink">0 บทบาท</span>
            </h3>
            <div class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto">
                <div class="relative group w-full sm:w-72">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-ink group-focus-within:text-accent-ink transition-colors"></i>
                    </div>
                    <label for="roles-search" class="sr-only">ค้นหาบทบาทหรือสิทธิ์</label>
                    <input id="roles-search" type="text" autocomplete="off"
                        placeholder="ค้นหาชื่อบทบาท / ชื่อสิทธิ์..."
                        class="elev-card bg-panel/40 rounded-[0.5rem] text-sm pl-10 pr-4 py-2 w-full text-ink focus:outline-none focus:ring-2 focus:ring-accent-ink focus:ring-1 focus:ring-accent-ink transition-all placeholder-body-muted">
                </div>
                <button id="btn-refresh-roles" type="button"
                    class="page-filter-control px-3 py-2 bg-panel/40 cursor-pointer text-ink flex items-center justify-center gap-1.5 rounded-[0.5rem] text-sm hover:bg-skeleton transition-colors w-full sm:w-auto">
                    <i class="fa-solid fa-rotate"></i> รีเฟรช
                </button>
            </div>
        </div>

        <!-- 2b ชิปตัวกรอง + ตัวนับผลลัพธ์ (ข้อ 11.5) -->
        <div class="px-6 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div id="roles-active-filters" class="flex flex-wrap gap-2"></div>
                <div id="roles-result-count" class="text-xs text-ink font-medium"></div>
            </div>
        </div>

        <!-- 2c กริดการ์ดบทบาท — เนื้อในเขียนจาก js/page-roles.js -->
        <div id="roles-grid" class="px-6 pb-6 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
    </div>
</div>
