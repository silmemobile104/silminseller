<div id="view-movements">
    <!-- [1] หัวหน้า — DESIGN.md ข้อ 11.2 -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <i class="bi bi-arrow-down-up text-white w-5 text-2xl text-center"></i>
            <h3 class="text-2xl text-white">ประวัติการเคลื่อนไหวสินค้า</h3>
        </div>
    </div>

    <!-- [2] การ์ดค้นหา -->
    <div class="bg-[#4D4D4D]/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">
        <div class="p-6">
            <form id="form-search-movement" class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1 space-y-2">
                    <label for="movement-search-input"
                        class="text-slate-200 font-medium flex items-center gap-2 text-xs">
                        <i class="fa-solid fa-barcode text-white"></i> เลข IMEI หรือรหัสสินค้า
                        <span class="text-red-500">*</span>
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-barcode text-white group-focus-within:text-[#FFE169] transition-colors"></i>
                        </div>
                        <input type="text" id="movement-search-input" required autocomplete="off"
                            placeholder="สแกนหรือพิมพ์เลข IMEI / รหัสสินค้า..."
                            class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-[#27272A] border border-[#3F3F46] text-white focus:border-[#FFE169] focus:outline-none transition-all placeholder-slate-500 text-sm font-mono tracking-wider">
                    </div>
                </div>
                <div class="flex items-end">
                    <button type="submit" id="btn-search-movement"
                        class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-[#FFE169] hover:bg-[#E2B93C] text-[#333333] font-semibold text-sm transition-colors flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap">
                        <i class="fa-solid fa-magnifying-glass"></i> ค้นหา
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- [3] ผลการค้นหา -->
    <div id="movement-result-area" class="hidden space-y-8">
        <!-- ข้อมูลสินค้า -->
        <div class="bg-[#4D4D4D]/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">
            <div class="p-6 flex flex-col sm:flex-row items-start gap-5">
                <div class="w-16 h-16 rounded-full flex items-center justify-center shrink-0"
                    style="color:#FFE169;background-color:#27272A;border:1px solid #FFE16959;">
                    <i class="fa-solid fa-mobile-screen text-2xl"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h4 id="mov-product-name" class="text-xl font-semibold text-white">-</h4>
                    <div class="mt-3 flex flex-wrap gap-2 text-xs">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[0.375rem] bg-[#4D4D4D]/60">
                            <i class="fa-solid fa-barcode text-[10px] text-white"></i>
                            <span id="mov-product-code" class="font-mono font-semibold text-[#FFE169]">-</span>
                        </span>
                        <span id="mov-query-badge"
                            class="hidden inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[0.375rem] bg-[#4D4D4D]/60">
                            <i class="fa-solid fa-tag text-[10px] text-white"></i>
                            <span class="text-white">IMEI</span>
                            <span id="mov-query-text" class="font-mono font-semibold text-[#FFE169]">-</span>
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[0.375rem] bg-[#4D4D4D]/60">
                            <i class="fa-solid fa-layer-group text-[10px] text-white"></i>
                            <span id="mov-type" class="text-white">-</span>
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[0.375rem] bg-[#4D4D4D]/60">
                            <i class="fa-solid fa-palette text-[10px] text-white"></i>
                            <span id="mov-color" class="text-white">-</span>
                        </span>
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-[0.375rem] bg-[#4D4D4D]/60">
                            <i class="fa-solid fa-database text-[10px] text-white"></i>
                            <span id="mov-capacity" class="text-white">-</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ไทม์ไลน์ -->
        <div class="bg-[#4D4D4D]/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">
            <div class="p-6 pb-0 flex flex-wrap items-center justify-between gap-3">
                <h3 class="text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-timeline text-[#FFE169]"></i> เส้นทางการเคลื่อนไหว
                </h3>
                <div id="movement-count" class="text-xs text-white font-medium"></div>
            </div>
            <div id="movement-timeline" class="relative px-6 py-6 space-y-4"></div>
        </div>
    </div>

    <!-- [4] สถานะเริ่มต้น / ไม่พบข้อมูล -->
    <div id="movement-empty-state"
        class="bg-[#4D4D4D]/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm px-6 py-14 text-center">
        <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4"
            style="color:#FFE169;background-color:#27272A;border:1px solid #FFE16959;">
            <i class="fa-solid fa-barcode text-xl"></i>
        </div>
        <h4 id="movement-empty-title" class="text-white font-semibold">พร้อมสำหรับการค้นหา</h4>
        <p id="movement-empty-desc" class="text-white/70 text-sm mt-1.5 max-w-md mx-auto">
            สแกนบาร์โค้ดหรือพิมพ์เลข IMEI ของเครื่อง เพื่อดูประวัติการรับเข้า โอนย้าย และการขายออก
        </p>
    </div>
</div>
