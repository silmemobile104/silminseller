<div id="view-personnel">
    <!-- [1] หัวหน้า — DESIGN.md ข้อ 11.2 -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <i class="bi bi-people text-ink w-5 text-2xl text-center"></i>
            <h3 class="text-2xl text-ink">จัดการพนักงาน</h3>
        </div>
        <button id="btn-add-employee" type="button"
            class="px-4 py-2 bg-primary hover:bg-[#E2B93C] text-on-primary font-medium rounded-xl transition-all flex items-center gap-2 w-fit cursor-pointer">
            <i class="fa-solid fa-user-plus"></i>
            <p>เพิ่มพนักงาน</p>
        </button>
    </div>

    <!-- [2] การ์ดพาเนล — แถบควบคุม + ชิป + ตาราง อยู่ในการ์ดใบเดียว (ข้อ 11.1, 11.3) -->
    <div class="bg-panel/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">
        <!-- 2a แถบควบคุม (ข้อ 11.4) -->
        <div class="p-6 pb-0 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h3 class="text-lg text-ink flex items-center gap-2">
                <i class="fa-solid fa-users text-accent-ink"></i> รายชื่อพนักงานทั้งหมด
                <span id="employee-count-badge"
                    class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-chip/60 text-ink">0 คน</span>
            </h3>
            <div class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto">
                <div class="relative group w-full sm:w-56">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-ink group-focus-within:text-accent-ink transition-colors"></i>
                    </div>
                    <label for="employee-search" class="sr-only">ค้นหาพนักงาน</label>
                    <input id="employee-search" type="text" autocomplete="off" placeholder="ค้นหาชื่อ / รหัสพนักงาน..."
                        class="elev-card bg-panel/40 rounded-[0.5rem] text-sm pl-10 pr-4 py-2 w-full text-ink focus:outline-none focus:ring-2 focus:ring-accent-ink focus:ring-1 focus:ring-accent-ink transition-all placeholder-body-muted">
                </div>
                <label for="employee-filter-role" class="sr-only">กรองตามตำแหน่ง</label>
                <select id="employee-filter-role"
                    class="page-filter-control bg-panel/40 cursor-pointer text-sm rounded-[0.5rem] px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-accent-ink w-full sm:w-auto [&>option]:bg-panel [&>option:checked]:bg-primary [&>option:checked]:text-on-primary">
                    <option value="">ทุกตำแหน่ง</option>
                </select>
                <label for="employee-filter-branch" class="sr-only">กรองตามสาขา</label>
                <select id="employee-filter-branch"
                    class="page-filter-control hidden md:block bg-panel/40 cursor-pointer text-sm rounded-[0.5rem] px-3 py-2 text-ink focus:outline-none focus:ring-1 focus:ring-accent-ink [&>option]:bg-panel [&>option:checked]:bg-primary [&>option:checked]:text-on-primary">
                    <option value="">ทุกสาขา</option>
                </select>
            </div>
        </div>

        <!-- 2b ชิปตัวกรอง + ตัวนับผลลัพธ์ + สลับมุมมอง (ข้อ 11.5) -->
        <div class="px-6 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div id="employee-active-filters" class="flex flex-wrap gap-2"></div>
                <div class="flex items-center gap-3">
                    <div id="employee-result-count" class="text-xs text-ink font-medium"></div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" id="employee-view-list" aria-label="มุมมองรายการ" aria-pressed="true"
                            class="w-9 h-9 rounded-md flex items-center justify-center transition-colors bg-primary text-on-primary">
                            <i class="fa-solid fa-list text-sm"></i>
                        </button>
                        <button type="button" id="employee-view-card" aria-label="มุมมองการ์ด" aria-pressed="false"
                            class="w-9 h-9 rounded-md flex items-center justify-center transition-colors bg-surface-chip text-body-muted hover:text-ink">
                            <i class="fa-solid fa-table-cells-large text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2c ตาราง (ข้อ 11.6) -->
        <div id="employee-view-list-wrap" class="overflow-x-auto" tabindex="0">
            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                <thead class="bg-panel/40 text-ink">
                    <tr>
                        <th class="px-6 py-4 font-semibold text-[15px] w-full">ชื่อ-นามสกุล</th>
                        <th class="px-6 py-4 font-semibold text-[15px]">รหัสพนักงาน</th>
                        <th class="px-6 py-4 font-semibold text-[15px]">ระดับสิทธิ์</th>
                        <th class="px-6 py-4 font-semibold text-[15px]">สาขาที่ประจำการ</th>
                        <th class="px-6 py-4 font-semibold text-[15px]">สถานะ</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-right">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="employee-table-body" class="divide-y divide-divider"></tbody>
            </table>
        </div>
        <!-- 2c' การ์ด (มุมมองทางเลือก — ซ่อนไว้ก่อน สลับผ่านปุ่มด้านบน) -->
        <div id="employee-view-cards" class="hidden grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 p-6"></div>
    </div>
</div>
