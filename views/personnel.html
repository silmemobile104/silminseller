<div id="view-personnel">

                        </div>

                            <span id="employee-count-badge"
                                class="bg-cyan-500/20 text-cyan-400 text-sm font-bold px-3 py-1 rounded-full border border-cyan-500/30">0

                        </div>

                                    </tr>
                                </thead>
                                <tbody id="employee-table-body" class="divide-y divide-slate-700/50">

                                </tbody>
                            </table>

                        <p class="text-slate-400 mt-1">กรุณาเพิ่มพนักงานใหม่เพื่อเริ่มใช้งาน</p>
