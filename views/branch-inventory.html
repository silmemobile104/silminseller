<div id="view-branch-inventory">
    <!-- [1] หัวหน้า — ตาม DESIGN.md ข้อ 11.2 (ไอคอน + ชื่อหน้า ซ้าย · ตัวสลับมุมมอง ขวา) -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <i class="hidden md:block bi bi-building text-ink w-5 text-2xl text-center" aria-hidden="true"></i>
            <h3 class="hidden md:block text-2xl text-ink">สินค้าในสาขา</h3>
        </div>
        <!-- ตัวสลับแบบ segmented: ใบที่เลือก = พื้นยก + ขอบ/ตัวอักษรเหลือง (ไม่ใช่เหลืองทึบ — ข้อ 11.9)
             className จริงเขียนจาก activateTab ใน js/page-branch-inventory.js -->
        <div role="group" aria-label="เลือกมุมมองสต็อก" class="elev-field inline-flex items-center gap-1 p-1 rounded-xl bg-field w-full sm:w-auto">
            <button id="tab-branch-mystock" type="button" aria-pressed="true" class="tab-toggle-btn">
                <i class="fa-solid fa-box-open text-xs"></i> สินค้าในสาขาของฉัน
            </button>
            <button id="tab-branch-globalstock" type="button" aria-pressed="false" class="tab-toggle-btn">
                <i class="fa-solid fa-globe text-xs"></i> สินค้าและราคาสาขาอื่น
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- [2] แท็บ 1: สต็อกในสาขาของฉัน                                -->
    <!-- แถบควบคุม + ชิปตัวกรอง + ตาราง อยู่ในการ์ดใบเดียว (ข้อ 11.1) -->
    <!-- ============================================================ -->
    <div id="content-branch-mystock" class="bg-panel/40 rounded-2xl overflow-hidden">
        <!-- 2a แถบควบคุม (ข้อ 11.4) -->
        <div class="p-6 pb-0 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div class="min-w-0">
                <h3 class="text-lg text-ink flex items-center gap-2">
                    <i class="fa-solid fa-box-open text-body-muted" aria-hidden="true"></i> สต็อกในสาขาของฉัน
                </h3>
                <!-- มูลค่ารวมตามราคาขาย (จำนวน × ราคาขายต่อชิ้น) — คิดตามตัวกรองประเภท/สภาพ ไม่ขึ้นกับช่องค้นหา
                     เขียนจาก loadBranchInventoryMyStock ใน js/page-branch-inventory.js -->
                <p class="mt-2 flex flex-wrap items-baseline gap-x-2 gap-y-0.5" aria-live="polite">
                    <span class="text-[13px] text-body-muted">มูลค่ารวม (ราคาขาย)</span>
                    <span id="value-branch-mystock" class="text-2xl font-semibold text-ink tracking-tight">-</span>
                    <span id="value-branch-mystock-sub" class="text-[13px] text-body-muted"></span>
                </p>
            </div>
            <div class="flex flex-col sm:flex-row sm:items-center gap-2.5 w-full lg:w-auto">
                <div class="relative group w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-body-muted group-focus-within:text-accent-ink transition-colors pointer-events-none"></i>
                    <input type="text" id="search-branch-mystock" placeholder="ค้นหา ชื่อ/รหัส/IMEI..." autocomplete="off"
                        aria-label="ค้นหาสินค้าในสาขาของฉัน ด้วยชื่อ รหัสสินค้า หรือ IMEI"
                        class="w-full h-10 pl-10 pr-4 rounded-xl bg-field text-ink text-sm placeholder:text-ink-muted-48 focus:outline-none focus:ring-1 focus:ring-accent-ink transition-all">
                </div>
                <div class="relative w-full sm:w-auto">
                    <select id="filter-branch-mystock-condition" aria-label="กรองตามสภาพเครื่อง"
                        class="w-full h-10 pl-3.5 pr-9 rounded-xl bg-field text-ink text-sm cursor-pointer appearance-none focus:outline-none focus:ring-1 focus:ring-accent-ink [&>option]:bg-canvas-elevated">
                        <option value="ALL">สภาพ: ทั้งหมด</option>
                        <option value="มือ1">สภาพ: มือ 1</option>
                        <option value="มือ2">สภาพ: มือ 2</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-[10px] text-body-muted pointer-events-none"></i>
                </div>
                <button id="btn-refresh-mystock" type="button" title="รีเฟรช" aria-label="รีเฟรชสต็อกในสาขาของฉัน"
                    class="shrink-0 h-10 w-full sm:w-10 flex items-center justify-center gap-2 rounded-xl bg-surface-chip hover:bg-field text-body-muted hover:text-ink text-sm transition-colors cursor-pointer">
                    <i class="fa-solid fa-rotate"></i><span class="sm:hidden">รีเฟรช</span>
                </button>
            </div>
        </div>

        <!-- 2b ชิปตัวกรองที่ใช้อยู่ + ตัวนับผลลัพธ์ (ข้อ 11.5) -->
        <div class="px-6 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div id="chips-branch-mystock" class="flex flex-wrap gap-2"></div>
                <div id="count-branch-mystock" class="text-xs text-ink font-medium whitespace-nowrap sm:ml-auto"></div>
            </div>
        </div>

        <!-- 2c ตาราง (ข้อ 11.6) -->
        <div class="overflow-x-auto" tabindex="0">
            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                <thead class="bg-panel/40 text-ink">
                    <tr>
                        <!-- w-full ให้คอลัมน์แรกดูดพื้นที่ว่างทั้งหมดไว้ คอลัมน์ตัวเลขจะได้เกาะกลุ่มกันชิดขวา
                             ไม่ลอยอยู่กลางตารางเวลาจอกว้าง (ตารางนี้มีแค่ 3 คอลัมน์ ต่างจากหน้า #stock ที่มี 9) -->
                        <th class="px-6 py-4 font-semibold text-[15px] w-full">สินค้า / รายละเอียด</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-center">คงเหลือ</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-right">ราคาขาย</th>
                    </tr>
                </thead>
                <tbody id="table-body-branch-mystock" class="divide-y divide-divider">
                    <!-- แถวถูกสร้างจาก js/page-branch-inventory.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- [2] แท็บ 2: สต็อกและราคาอ้างอิงทุกสาขา                       -->
    <!-- ============================================================ -->
    <div id="content-branch-globalstock" class="hidden bg-panel/40 rounded-2xl overflow-hidden">
        <!-- 2a แถบควบคุม -->
        <div class="p-6 pb-0 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h3 class="text-lg text-ink flex items-center gap-2">
                <i class="fa-solid fa-globe text-body-muted" aria-hidden="true"></i> สต็อกและราคาอ้างอิงทุกสาขา
            </h3>
            <div class="flex flex-col sm:flex-row sm:items-center gap-2.5 w-full lg:w-auto">
                <div class="relative group w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-body-muted group-focus-within:text-accent-ink transition-colors pointer-events-none"></i>
                    <input type="text" id="search-branch-globalstock" placeholder="ค้นหา ชื่อ/สาขา/รหัส..." autocomplete="off"
                        aria-label="ค้นหาสินค้าและราคาของสาขาอื่น ด้วยชื่อสินค้า ชื่อสาขา หรือรหัสสินค้า"
                        class="w-full h-10 pl-10 pr-4 rounded-xl bg-field text-ink text-sm placeholder:text-ink-muted-48 focus:outline-none focus:ring-1 focus:ring-accent-ink transition-all">
                </div>
                <div class="relative w-full sm:w-auto">
                    <select id="filter-branch-globalstock-type" aria-label="กรองตามประเภทสินค้า"
                        class="w-full h-10 pl-3.5 pr-9 rounded-xl bg-field text-ink text-sm cursor-pointer appearance-none focus:outline-none focus:ring-1 focus:ring-accent-ink [&>option]:bg-canvas-elevated">
                        <option value="ALL">ประเภท: ทั้งหมด</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-[10px] text-body-muted pointer-events-none"></i>
                </div>
                <div class="relative w-full sm:w-auto">
                    <select id="filter-branch-globalstock-condition" aria-label="กรองตามสภาพเครื่อง"
                        class="w-full h-10 pl-3.5 pr-9 rounded-xl bg-field text-ink text-sm cursor-pointer appearance-none focus:outline-none focus:ring-1 focus:ring-accent-ink [&>option]:bg-canvas-elevated">
                        <option value="ALL">สภาพ: ทั้งหมด</option>
                        <option value="มือ1">สภาพ: มือ 1</option>
                        <option value="มือ2">สภาพ: มือ 2</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-[10px] text-body-muted pointer-events-none"></i>
                </div>
                <button id="btn-refresh-globalstock" type="button" title="รีเฟรช" aria-label="รีเฟรชสต็อกทุกสาขา"
                    class="shrink-0 h-10 w-full sm:w-10 flex items-center justify-center gap-2 rounded-xl bg-surface-chip hover:bg-field text-body-muted hover:text-ink text-sm transition-colors cursor-pointer">
                    <i class="fa-solid fa-rotate"></i><span class="sm:hidden">รีเฟรช</span>
                </button>
            </div>
        </div>

        <!-- 2b ชิปตัวกรองที่ใช้อยู่ + ตัวนับผลลัพธ์ -->
        <div class="px-6 py-4">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div id="chips-branch-globalstock" class="flex flex-wrap gap-2"></div>
                <div id="count-branch-globalstock" class="text-xs text-ink font-medium whitespace-nowrap sm:ml-auto"></div>
            </div>
        </div>

        <!-- 2c ตาราง -->
        <div class="overflow-x-auto" tabindex="0">
            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                <thead class="bg-panel/40 text-ink">
                    <tr>
                        <th class="px-6 py-4 font-semibold text-[15px] w-full">สินค้า / สาขา / รายละเอียด</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-center">คงเหลือ</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-right">ราคาขายอ้างอิง</th>
                    </tr>
                </thead>
                <tbody id="table-body-branch-globalstock" class="divide-y divide-divider">
                    <!-- แถวถูกสร้างจาก js/page-branch-inventory.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>
