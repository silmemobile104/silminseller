<div id="view-branch-inventory">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-2">
        <div>
            <h3 class="text-2xl font-bold text-white flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center border border-emerald-500/30">
                    <i class="fa-solid fa-store text-emerald-400"></i>
                </div>
                สินค้าในสาขา
            </h3>
            <p class="text-slate-400 mt-1">ดูสต็อกสินค้าภายในสาขาของคุณ และตรวจสอบราคากลาง/สาขาอื่น</p>
        </div>
    </div>
    <!-- Tabs Navigation -->
    <div class="flex space-x-2  pb-2">
        <button id="tab-branch-mystock"
            class="px-6 py-3 text-sm font-bold rounded-lg transition-all text-slate-900 bg-[#f5b11a] border border-transparent">
            <i class="fa-solid fa-box-open mr-2"></i> สินค้าในสาขาของฉัน
        </button>
        <button id="tab-branch-globalstock"
            class="px-6 py-3 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200 border border-slate-700 bg-transparent">
            <i class="fa-solid fa-globe mr-2"></i> สินค้าและราคาสาขาอื่น
        </button>
    </div>

    <!-- TAB CONTENT: My Branch Stock -->
    <div id="content-branch-mystock" class="space-y-4">
        <div
            class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
            <div class="flex flex-col sm:flex-row gap-3 w-full md:max-w-2xl">
                <div class="relative flex-1 group">
                    <i
                        class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-emerald-400 transition-colors"></i>
                    <input type="text" id="search-branch-mystock" placeholder="ค้นหาสินค้าในสาขา (ชื่อ, รหัส, IMEI)..."
                        class="w-full bg-white border border-slate-300 rounded-xl pl-11 pr-4 py-2.5 text-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm">
                </div>
                <select id="filter-branch-mystock-type"
                    class="w-full sm:w-44 bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">ประเภททั้งหมด</option>
                </select>
                <select id="filter-branch-mystock-condition"
                    class="w-full sm:w-44 bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-slate-900 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">สภาพทั้งหมด</option>
                    <option value="มือ1">มือ 1</option>
                    <option value="มือ2">มือ 2</option>
                </select>
            </div>
            <button id="btn-refresh-mystock"
                class="w-full md:w-auto px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-all shadow shadow-black/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> รีเฟรช
            </button>
        </div>

        <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-900/80 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="px-3 py-4 md:px-6 font-bold whitespace-nowrap">สินค้า /
                                รายละเอียด</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-center whitespace-nowrap">
                                คงเหลือ</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-right whitespace-nowrap">ราคาขาย
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table-body-branch-mystock" class="divide-y divide-slate-700/50">
                        <!-- Data loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB CONTENT: Global Stock -->
    <div id="content-branch-globalstock" class="hidden space-y-4">
        <div
            class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
            <div class="flex flex-col sm:flex-row gap-3 w-full md:max-w-2xl">
                <div class="relative flex-1 group">
                    <i
                        class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-cyan-400 transition-colors"></i>
                    <input type="text" id="search-branch-globalstock" placeholder="ค้นหาราคาหรือสต็อกสาขาอื่น..."
                        class="w-full bg-white border border-slate-300 rounded-xl pl-11 pr-4 py-2.5 text-slate-900 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-sm">
                </div>
                <select id="filter-branch-globalstock-type"
                    class="w-full sm:w-44 bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-slate-900 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">ประเภททั้งหมด</option>
                </select>
                <select id="filter-branch-globalstock-condition"
                    class="w-full sm:w-44 bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-slate-900 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">สภาพทั้งหมด</option>
                    <option value="มือ1">มือ 1</option>
                    <option value="มือ2">มือ 2</option>
                </select>
            </div>
            <button id="btn-refresh-globalstock"
                class="w-full md:w-auto px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl transition-all shadow shadow-black/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> รีเฟรช
            </button>
        </div>

        <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-900/80 text-slate-300 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="px-3 py-4 md:px-6 font-bold w-1/2 whitespace-nowrap">สินค้า /
                                สาขา / รายละเอียด</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-center whitespace-nowrap">
                                คงเหลือ</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-right whitespace-nowrap">
                                ราคาขายอ้างอิง</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-branch-globalstock" class="divide-y divide-slate-700/50">
                        <!-- Data loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
