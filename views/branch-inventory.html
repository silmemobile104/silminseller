<div id="view-branch-inventory">
    <!-- [1] หัวหน้า — ตาม DESIGN.md ข้อ 11.2 (ไอคอน + ชื่อหน้า ซ้าย · แท็บสลับมุมมอง ขวา) -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <i class="bi bi-building text-white w-5 text-2xl text-center"></i>
            <h3 class="text-2xl text-white">สินค้าในสาขา</h3>
        </div>
        <!-- แท็บ: ปุ่มทึบเหลืองของหน้านี้มีได้ปุ่มเดียว = แท็บที่เลือกอยู่ (DESIGN.md ข้อ 6) -->
        <div class="flex flex-wrap items-center gap-2">
            <button id="tab-branch-mystock" type="button" aria-pressed="true"
                class="px-4 py-2.5 rounded-xl text-sm font-bold border transition-colors flex items-center gap-2 cursor-pointer bg-[#FFE169] text-[#333333] border-[#FFE169]">
                <i class="fa-solid fa-box-open"></i> สินค้าในสาขาของฉัน
            </button>
            <button id="tab-branch-globalstock" type="button" aria-pressed="false"

                <i class="fa-solid fa-globe"></i> สินค้าและราคาสาขาอื่น
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <div id="content-branch-mystock" class="bg-[#4D4D4D]/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">

        <div class="p-6 pb-0 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h3 class="text-lg text-white flex items-center gap-2">

            </h3>
            <div class="flex flex-wrap items-center gap-2.5 relative w-full lg:w-auto">

                        <i
                            class="fa-solid fa-search text-white group-focus-within:text-[#FFE169] transition-colors"></i>

                    class="bg-transparent border border-white/30 rounded-[10px] cursor-pointer text-sm px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-[#FFE169] w-full sm:w-auto [&>option]:bg-[#4D4D4D] [&>option:checked]:bg-[#FFE169] [&>option:checked]:text-[#333333]">
                    <option value="ALL">สภาพทั้งหมด</option>
                    <option value="มือ1">มือ 1</option>
                    <option value="มือ2">มือ 2</option>
                </select>
                <button id="btn-refresh-mystock" type="button"

                    <i class="fa-solid fa-rotate"></i> รีเฟรช
                </button>
            </div>

            </div>

            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                <thead class="bg-[#4D4D4D]/40 text-white">

                             ไม่ลอยอยู่กลางตารางเวลาจอกว้าง (ตารางนี้มีแค่ 3 คอลัมน์ ต่างจากหน้า #stock ที่มี 9) -->

                        <th class="px-6 py-4 font-semibold text-[15px] text-center">คงเหลือ</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-right">ราคาขาย</th>
                    </tr>
                </thead>
                <tbody id="table-body-branch-mystock" class="divide-y divide-[#464646]">
                    <!-- แถวถูกสร้างจาก js/page-branch-inventory.js -->
                </tbody>
            </table>
        </div>
    </div>

                    <option value="ALL">ประเภททั้งหมด</option>

                    <option value="ALL">สภาพทั้งหมด</option>
                    <option value="มือ1">มือ 1</option>

                </thead>
                <tbody id="table-body-branch-globalstock" class="divide-y divide-[#464646]">
