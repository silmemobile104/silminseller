<div id="view-branch-inventory">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-2">
        <div>
            <h3 class="text-2xl font-bold text-ink flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-sm bg-surface-chip flex items-center justify-center">
                    <i class="fa-solid fa-store text-ink"></i>
                </div>
                สินค้าในสาขา
            </h3>
            <p class="text-body-muted mt-1">ดูสต็อกสินค้าภายในสาขาของคุณ และตรวจสอบราคากลาง/สาขาอื่น</p>
        </div>
    </div>
    <!-- Tabs Navigation -->
    <div class="flex space-x-2  pb-2">
        <button id="tab-branch-mystock"
            class="px-6 py-3 text-sm font-bold rounded-pill transition-all text-on-primary bg-primary border border-transparent">
            <i class="fa-solid fa-box-open mr-2"></i> สินค้าในสาขาของฉัน
        </button>
        <button id="tab-branch-globalstock"
            class="px-6 py-3 text-sm font-bold rounded-pill transition-all text-body-muted hover:text-ink border border-hairline bg-transparent">
            <i class="fa-solid fa-globe mr-2"></i> สินค้าและราคาสาขาอื่น
        </button>
    </div>

    <!-- TAB CONTENT: My Branch Stock -->
    <div id="content-branch-mystock" class="space-y-4">
        <div
            class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center bg-canvas-elevated p-4 rounded-md border border-hairline">
            <div class="flex flex-col sm:flex-row gap-3 w-full md:max-w-2xl">
                <div class="relative flex-1 group">
                    <i
                        class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-body-muted group-focus-within:text-primary transition-colors"></i>
                    <input type="text" id="search-branch-mystock" placeholder="ค้นหาสินค้าในสาขา (ชื่อ, รหัส, IMEI)..."
                        class="w-full bg-surface-chip border border-divider-soft rounded-pill pl-11 pr-4 py-2.5 text-ink focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all text-sm">
                </div>
                <select id="filter-branch-mystock-type"
                    class="w-full sm:w-44 bg-surface-chip border border-divider-soft rounded-sm px-3 py-2.5 text-ink focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">ประเภททั้งหมด</option>
                </select>
                <select id="filter-branch-mystock-condition"
                    class="w-full sm:w-44 bg-surface-chip border border-divider-soft rounded-sm px-3 py-2.5 text-ink focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">สภาพทั้งหมด</option>
                    <option value="มือ1">มือ 1</option>
                    <option value="มือ2">มือ 2</option>
                </select>
            </div>
            <button id="btn-refresh-mystock"
                class="w-full md:w-auto px-4 py-2.5 bg-surface-chip hover:bg-surface-tile-2 text-ink rounded-pill transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> รีเฟรช
            </button>
        </div>

        <div class="bg-canvas-elevated rounded-lg border border-hairline overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-surface-tile-3 text-body-muted text-xs uppercase tracking-wider border-b border-hairline">
                            <th class="px-3 py-4 md:px-6 font-bold whitespace-nowrap">สินค้า /
                                รายละเอียด</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-center whitespace-nowrap">
                                คงเหลือ</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-right whitespace-nowrap">ราคาขาย
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table-body-branch-mystock" class="divide-y divide-hairline">
                        <!-- Data loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB CONTENT: Global Stock -->
    <div id="content-branch-globalstock" class="hidden space-y-4">
        <div
            class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center bg-canvas-elevated p-4 rounded-md border border-hairline">
            <div class="flex flex-col sm:flex-row gap-3 w-full md:max-w-2xl">
                <div class="relative flex-1 group">
                    <i
                        class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-body-muted group-focus-within:text-primary transition-colors"></i>
                    <input type="text" id="search-branch-globalstock" placeholder="ค้นหาราคาหรือสต็อกสาขาอื่น..."
                        class="w-full bg-surface-chip border border-divider-soft rounded-pill pl-11 pr-4 py-2.5 text-ink focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all text-sm">
                </div>
                <select id="filter-branch-globalstock-type"
                    class="w-full sm:w-44 bg-surface-chip border border-divider-soft rounded-sm px-3 py-2.5 text-ink focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">ประเภททั้งหมด</option>
                </select>
                <select id="filter-branch-globalstock-condition"
                    class="w-full sm:w-44 bg-surface-chip border border-divider-soft rounded-sm px-3 py-2.5 text-ink focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all text-sm font-semibold cursor-pointer">
                    <option value="ALL">สภาพทั้งหมด</option>
                    <option value="มือ1">มือ 1</option>
                    <option value="มือ2">มือ 2</option>
                </select>
            </div>
            <button id="btn-refresh-globalstock"
                class="w-full md:w-auto px-4 py-2.5 bg-surface-chip hover:bg-surface-tile-2 text-ink rounded-pill transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> รีเฟรช
            </button>
        </div>

        <div class="bg-canvas-elevated rounded-lg border border-hairline overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-surface-tile-3 text-body-muted text-xs uppercase tracking-wider border-b border-hairline">
                            <th class="px-3 py-4 md:px-6 font-bold w-1/2 whitespace-nowrap">สินค้า /
                                สาขา / รายละเอียด</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-center whitespace-nowrap">
                                คงเหลือ</th>
                            <th class="px-3 py-4 md:px-6 font-bold text-right whitespace-nowrap">
                                ราคาขายอ้างอิง</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-branch-globalstock" class="divide-y divide-hairline">
                        <!-- Data loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
