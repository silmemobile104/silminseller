<div id="view-members">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h3 class="text-2xl font-bold text-white">สมาชิก</h3>
                            <p class="text-slate-400 mt-1">จัดการข้อมูลสมาชิกลูกค้า พร้อมระบบอ่านบัตรประชาชน</p>
                        </div>
                        <button id="btn-add-member"
                            class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-medium rounded-xl shadow-lg shadow-cyan-500/20 transition-all flex items-center gap-2 w-fit glow-button">
                            <i class="fa-solid fa-user-plus"></i>
                            เพิ่มสมาชิก
                        </button>
                    </div>

                    <!-- Members Search -->
                    <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-lg overflow-hidden">
                        <div
                            class="p-6 border-b border-slate-700 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                <i class="fa-solid fa-address-card text-teal-400"></i>
                                รายชื่อสมาชิก
                            </h3>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i
                                        class="fa-solid fa-search text-slate-400 group-focus-within:text-cyan-400 transition-colors"></i>
                                </div>
                                <input id="member-search-input" type="text"
                                    placeholder="ค้นหาชื่อ, เลขบัตร, เบอร์โทร..."
                                    class="bg-white border border-slate-300 text-sm rounded-lg pl-10 pr-4 py-2 w-64 text-slate-900 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all placeholder-slate-500">
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm whitespace-nowrap">
                                <thead class="bg-slate-900/50 text-slate-400">
                                    <tr>
                                        <th class="px-6 py-4 font-medium">รูป</th>
                                        <th class="px-6 py-4 font-medium">เลขสมาชิก</th>
                                        <th class="px-6 py-4 font-medium">ชื่อ-นามสกุล</th>
                                        <th class="px-6 py-4 font-medium">เลขบัตรประชาชน</th>
                                        <th class="px-6 py-4 font-medium">เบอร์โทร</th>
                                        <th class="px-6 py-4 font-medium">แหล่งที่มา</th>
                                        <th class="px-6 py-4 font-medium">วันที่ลงทะเบียน</th>
                                        <th class="px-6 py-4 font-medium text-right">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody id="member-table-body" class="divide-y divide-slate-700/50">
                                    <!-- Data will be loaded here by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
</div>
