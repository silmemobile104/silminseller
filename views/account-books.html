<div id="view-account-books">
    <!-- [1] หัวหน้า — DESIGN.md ข้อ 11.2 -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-4">
            <i class="hidden md:block bi bi-journal-check text-ink w-5 text-2xl text-center"></i>
            <h3 class="hidden md:block text-2xl text-ink">สมุดบัญชี</h3>
        </div>
        <button id="btn-add-account-book" type="button"
            class="px-4 py-2 bg-primary hover:bg-primary-pressed text-on-primary font-medium rounded-xl transition-all flex items-center gap-2 w-fit cursor-pointer">
            <i class="fa-solid fa-plus"></i>
            <p>เพิ่มสมุดบัญชี</p>
        </button>
    </div>

    <!-- [2] การ์ดพาเนล: รายการสมุดบัญชี + หมวดที่สมุดนั้นอยู่ -->
    <div class="bg-panel/40 rounded-2xl shadow-lg overflow-hidden backdrop-blur-sm">
        <div class="p-6 pb-0 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h3 class="text-lg text-ink flex items-center gap-2">
                <i class="bi bi-journal-check text-accent-ink"></i> รายการสมุดบัญชี
            </h3>
            <div class="relative group w-full lg:w-64 rounded-[0.5rem]">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-search text-ink group-focus-within:text-accent-ink transition-colors"></i>
                </div>
                <input type="text" id="account-book-search" placeholder="ค้นหารหัส / ชื่อสมุด..."
                    aria-label="ค้นหาสมุดบัญชี"
                    class="page-filter-control elev-chip bg-transparent rounded-[10px] text-sm pl-10 pr-4 py-2 w-full text-ink focus:outline-none focus:ring-1 focus:ring-accent-ink transition-all placeholder-body-muted">
            </div>
        </div>
        <div class="px-6 py-4">
            <div id="account-book-count" class="text-xs text-ink font-medium"></div>
        </div>
        <div class="overflow-x-auto" tabindex="0">
            <table class="w-full text-left text-sm whitespace-nowrap border-collapse">
                <thead class="bg-panel/40 text-ink">
                    <tr>
                        <th class="px-6 py-4 font-semibold text-[15px]">รหัสสมุด</th>
                        <th class="px-6 py-4 font-semibold text-[15px]">ชื่อสมุดบัญชี</th>
                        <th class="px-6 py-4 font-semibold text-[15px] w-full">หมวดบัญชี</th>
                        <th class="px-6 py-4 font-semibold text-[15px] text-right">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="account-book-table-body" class="divide-y divide-divider"></tbody>
            </table>
        </div>
    </div>

    <!-- โมดัลเพิ่ม/แก้ไขสมุดบัญชี -->
    <div id="modal-account-book" role="dialog" aria-modal="true" aria-labelledby="account-book-modal-title"
        class="fixed inset-0 backdrop-blur-[20px] backdrop-saturate-[1.8] z-50 hidden flex items-center justify-center p-4">
        <div class="modal-content bg-canvas-elevated rounded-lg w-full max-w-md p-6 space-y-4">
            <h3 class="text-lg font-bold text-ink flex items-center gap-2">
                <i class="fa-solid fa-pen text-body-muted"></i>
                <span id="account-book-modal-title">เพิ่มสมุดบัญชี</span>
            </h3>
            <input type="hidden" id="account-book-id">
            <div>
                <label for="account-book-category" class="block text-body-muted text-xs mb-1">หมวดบัญชี <span class="text-red-500">*</span></label>
                <select id="account-book-category"
                    class="elev-chip w-full px-3 py-2.5 rounded-sm bg-surface-chip text-ink text-sm focus:ring-2 focus:ring-primary-focus outline-none">
                    <option value="">-- เลือกหมวด --</option>
                </select>
            </div>
            <div>
                <label for="account-book-code" class="block text-body-muted text-xs mb-1">รหัสสมุดบัญชี <span class="text-red-500">*</span></label>
                <input type="text" id="account-book-code" placeholder="เช่น 01" autocomplete="off" maxlength="20"
                    class="elev-chip w-full px-3 py-2.5 rounded-sm bg-surface-chip text-ink text-sm font-mono focus:ring-2 focus:ring-primary-focus outline-none">
            </div>
            <div>
                <label for="account-book-name" class="block text-body-muted text-xs mb-1">ชื่อสมุดบัญชี <span class="text-red-500">*</span></label>
                <input type="text" id="account-book-name" placeholder="เช่น สมุดรายวันรับ" autocomplete="off" maxlength="120"
                    class="elev-chip w-full px-3 py-2.5 rounded-sm bg-surface-chip text-ink text-sm focus:ring-2 focus:ring-primary-focus outline-none">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" id="account-book-save"
                    class="flex-1 py-2.5 bg-primary hover:bg-primary-pressed text-on-primary rounded-pill font-medium text-sm transition-all cursor-pointer">บันทึก</button>
                <button type="button" id="account-book-cancel"
                    class="flex-1 py-2.5 bg-surface-chip hover:bg-surface-tile-2 text-body-muted rounded-pill font-medium text-sm transition-all cursor-pointer">ยกเลิก</button>
            </div>
        </div>
    </div>
</div>
