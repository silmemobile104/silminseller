<div id="view-movements">
                    <!-- Header -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="relative">
                            <h2 class="relative text-3xl font-bold text-ink">
                                <i class="fa-solid fa-route text-body-muted mr-2"></i> ประวัติการเคลื่อนไหวสินค้า
                            </h2>
                            <p class="text-body-muted mt-2 font-medium flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                                ติดตามเส้นทางและตรวจสอบประวัติของสินค้ารายชิ้น หรือ IMEI แบบ Real-time
                            </p>
                        </div>
                    </div>

                    <!-- Search Panel -->
                    <div class="relative group">
                        <div
                            class="relative bg-canvas-elevated border border-hairline rounded-lg p-8">
                            <form id="form-search-movement" class="flex flex-col md:flex-row gap-5">
                                <div class="flex-1 relative">
                                    <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none">
                                        <i
                                            class="fa-solid fa-barcode text-xl text-body-muted group-focus-within:text-primary transition-colors duration-300"></i>
                                    </div>
                                    <input type="text" id="movement-search-input"
                                        placeholder="สแกนหรือพิมพ์เลข IMEI / รหัสสินค้าที่นี่..."
                                        class="w-full bg-surface-chip border border-divider-soft rounded-pill py-4 pl-14 pr-6 text-lg text-ink placeholder-ink-muted-48 focus:outline-none focus:border-primary-focus focus:ring-1 focus:ring-primary-focus/40 transition-all font-mono tracking-wider"
                                        required autocomplete="off">
                                </div>
                                <button type="submit" id="btn-search-movement"
                                    class="relative overflow-hidden bg-primary hover:bg-primary-pressed text-on-primary font-bold py-4 px-10 rounded-pill transition-all duration-300 group/btn">
                                    <span class="relative z-10 flex items-center text-lg">
                                        <i
                                            class="fa-solid fa-magnifying-glass mr-2 group-hover/btn:rotate-12 transition-transform duration-300"></i>
                                        ค้นหา
                                    </span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Result Area -->
                    <div id="movement-result-area" class="hidden space-y-8 animate-fade-in-up">
                        <!-- Product Info Card -->
                        <div
                            class="bg-canvas-elevated border border-hairline rounded-lg p-6 flex flex-col md:flex-row items-center gap-6">
                            <div
                                class="w-24 h-24 rounded-lg bg-surface-chip flex items-center justify-center border border-hairline relative overflow-hidden">
                                <i
                                    class="fa-solid fa-mobile-screen-button text-4xl text-ink"></i>
                            </div>
                            <div class="flex-1 text-center md:text-left">
                                <h3 id="mov-product-name" class="text-2xl font-bold text-ink tracking-wide"></h3>
                                <div class="mt-4 flex flex-wrap justify-center md:justify-start gap-3 text-sm">
                                    <span
                                        class="bg-surface-chip border border-hairline px-4 py-1.5 rounded-md text-body-muted flex items-center">
                                        <i class="fa-solid fa-barcode text-body-muted mr-2"></i> <span
                                            id="mov-product-code"
                                            class="font-mono text-ink font-medium tracking-wider"></span>
                                    </span>
                                    <span id="mov-query-badge"
                                        class="hidden bg-surface-chip border border-hairline px-4 py-1.5 rounded-md text-ink flex items-center">
                                        <i class="fa-solid fa-tag mr-2"></i> <span
                                            class="text-body-muted mr-1">IMEI:</span> <span id="mov-query-text"
                                            class="font-mono font-bold tracking-wider text-ink"></span>
                                    </span>
                                    <span
                                        class="bg-surface-chip border border-hairline px-4 py-1.5 rounded-md text-body-muted flex items-center"><i
                                            class="fa-solid fa-layer-group text-body-muted mr-2 text-xs"></i><span
                                            id="mov-type"></span></span>
                                    <span
                                        class="bg-surface-chip border border-hairline px-4 py-1.5 rounded-md text-body-muted flex items-center"><i
                                            class="fa-solid fa-palette text-body-muted mr-2 text-xs"></i><span
                                            id="mov-color"></span></span>
                                    <span
                                        class="bg-surface-chip border border-hairline px-4 py-1.5 rounded-md text-body-muted flex items-center"><i
                                            class="fa-solid fa-hard-drive text-body-muted mr-2 text-xs"></i><span
                                            id="mov-capacity"></span></span>
                                </div>
                            </div>
                        </div>

                        <!-- Timeline -->
                        <div class="relative">
                            <div
                                class="relative bg-canvas-elevated border border-hairline rounded-lg p-8">
                                <h3
                                    class="text-xl font-bold text-ink mb-8 border-b border-hairline pb-4 flex items-center">
                                    <i class="fa-solid fa-timeline text-body-muted mr-3 text-2xl"></i>
                                    เส้นทางการเคลื่อนไหว (Ledger Timeline)
                                </h3>
                                <div class="relative pl-10 space-y-10" id="movement-timeline">
                                    <!-- JS will populate -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div id="movement-empty-state"
                        class="bg-canvas-elevated border-2 border-hairline border-dashed rounded-lg p-16 text-center transition-all hover:border-primary/30">
                        <div class="relative w-28 h-28 mx-auto mb-6 group">
                            <div
                                class="relative w-full h-full bg-surface-chip rounded-full flex items-center justify-center border border-hairline">
                                <i
                                    class="fa-solid fa-satellite-dish text-5xl text-ink-muted-48 group-hover:text-primary transition-colors duration-500"></i>
                            </div>
                        </div>
                        <h3 class="text-2xl font-bold text-ink mb-2">พร้อมสำหรับการค้นหา</h3>
                        <p class="text-body-muted mt-2 max-w-lg mx-auto text-lg">สแกนบาร์โค้ด หรือพิมพ์เลข IMEI
                            ของเครื่อง เพื่อติดตามประวัติการรับเข้า โอนย้าย หรือการขายออกอย่างละเอียด</p>
                    </div>
</div>
